{{define "content"}}
<div class="page-header flex-between">
    <div><h1 class="page-title">项目管理</h1></div>
    <button class="btn btn-primary" onclick="showCreateModal()">+ 新建项目</button>
</div>

<div class="card">
    <div class="table-responsive">
        <table class="table">
            <thead>
                <tr><th>项目名称</th><th>编码</th><th>项目经理</th><th>状态</th><th>进度</th><th>开始日期</th><th>结束日期</th><th>操作</th></tr>
            </thead>
            <tbody>
                {{range .Projects}}
                <tr>
                    <td><a href="/project/{{.ID}}">{{.Name}}</a></td>
                    <td>{{.Code}}</td>
                    <td>{{.ManagerName}}</td>
                    <td>
                        {{if eq .Status 1}}<span class="tag tag-warning">规划中</span>
                        {{else if eq .Status 2}}<span class="tag tag-primary">进行中</span>
                        {{else if eq .Status 3}}<span class="tag tag-success">已完成</span>
                        {{else}}<span class="tag">已归档</span>{{end}}
                    </td>
                    <td><div class="progress"><div class="progress-bar" style="width:{{.Progress}}%"></div></div></td>
                    <td>{{.StartDate}}</td>
                    <td>{{.EndDate}}</td>
                    <td>
                        <a href="/project/{{.ID}}" class="btn btn-sm btn-default">查看</a>
                        <button class="btn btn-sm btn-default" onclick="editProject({{.ID}},'{{.Name}}','{{.Code}}',{{.Status}},{{.Progress}})">编辑</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteProject({{.ID}})">删除</button>
                    </td>
                </tr>
                {{else}}
                <tr><td colspan="8" style="text-align:center;color:#999;">暂无项目</td></tr>
                {{end}}
            </tbody>
        </table>
    </div>
</div>

<!-- 创建项目模态框 -->
<div id="createModal" class="modal" style="display:none;">
    <div class="modal-content">
        <div class="modal-header"><h3>新建项目</h3><span class="close" onclick="closeModal('createModal')">&times;</span></div>
        <div class="modal-body">
            <div class="form-group"><label>项目名称</label><input type="text" id="newName" class="form-control" placeholder="请输入项目名称"></div>
            <div class="form-group"><label>项目编码</label><input type="text" id="newCode" class="form-control" placeholder="请输入项目编码"></div>
            <div class="form-group"><label>项目模板</label>
                <select id="newTemplate" class="form-control">
                    <option value="1">软件开发项目</option>
                    <option value="2">建筑工程项目</option>
                    <option value="3">咨询项目</option>
                    <option value="4">审计项目</option>
                    <option value="5">政府项目</option>
                    <option value="6">市场营销项目</option>
                </select>
            </div>
            <div class="form-group"><label>开始日期</label><input type="date" id="newStartDate" class="form-control"></div>
            <div class="form-group"><label>结束日期</label><input type="date" id="newEndDate" class="form-control"></div>
            <div class="form-group"><label>项目描述</label><textarea id="newDesc" class="form-control" rows="3"></textarea></div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-default" onclick="closeModal('createModal')">取消</button>
            <button class="btn btn-primary" onclick="createProject()">创建</button>
        </div>
    </div>
</div>

<!-- 编辑项目模态框 -->
<div id="editModal" class="modal" style="display:none;">
    <div class="modal-content">
        <div class="modal-header"><h3>编辑项目</h3><span class="close" onclick="closeModal('editModal')">&times;</span></div>
        <div class="modal-body">
            <input type="hidden" id="editId">
            <div class="form-group"><label>项目名称</label><input type="text" id="editName" class="form-control"></div>
            <div class="form-group"><label>项目编码</label><input type="text" id="editCode" class="form-control"></div>
            <div class="form-group"><label>状态</label>
                <select id="editStatus" class="form-control">
                    <option value="1">规划中</option>
                    <option value="2">进行中</option>
                    <option value="3">已完成</option>
                    <option value="4">已归档</option>
                </select>
            </div>
            <div class="form-group"><label>进度</label><input type="number" id="editProgress" class="form-control" min="0" max="100"></div>
            <div class="form-group"><label>项目描述</label><textarea id="editDesc" class="form-control" rows="3"></textarea></div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-default" onclick="closeModal('editModal')">取消</button>
            <button class="btn btn-primary" onclick="saveProject()">保存</button>
        </div>
    </div>
</div>
{{end}}
