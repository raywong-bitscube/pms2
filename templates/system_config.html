{{define "content"}}
<div class="page-header flex-between">
    <h1 class="page-title">系统常量</h1>
    <button class="btn btn-primary" onclick="showAddModal()">➕ 新增</button>
</div>
<div class="card"><table class="table">
<thead><tr><th>配置键</th><th>配置值</th><th>说明</th><th>创建时间</th><th>操作</th></tr></thead>
<tbody>{{range .Configs}}<tr><td>{{.Key}}</td><td>{{.Value}}</td><td>{{.Description}}</td><td>{{.CreatedAt}}</td><td><button class="btn btn-sm btn-default" onclick="editConfig({{.ID}},'{{.Key}}','{{.Value}}','{{.Description}}')">编辑</button> <button class="btn btn-sm btn-danger" onclick="deleteConfig({{.ID}})">删除</button></td></tr>{{else}}<tr><td colspan="5" style="text-align:center;color:#999;">暂无数据</td></tr>{{end}}</tbody>
</table></div>
<div id="configModal" class="modal" style="display:none;"><div class="modal-content" style="max-width:500px;"><div class="modal-header"><h3>系统常量</h3><span class="close" onclick="cm('configModal')">&times;</span></div><div class="modal-body"><input type="hidden" id="cfgId"><div class="form-group"><label>配置键</label><input type="text" id="cfgKey" class="form-control" required></div><div class="form-group"><label>配置值</label><input type="text" id="cfgValue" class="form-control"></div><div class="form-group"><label>说明</label><textarea id="cfgDesc" class="form-control" rows="3"></textarea></div></div><div class="modal-footer"><button class="btn btn-default" onclick="cm('configModal')">取消</button><button class="btn btn-primary" onclick="saveConfig()">保存</button></div></div></div>
<style>
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;display:flex;align-items:center;justify-content:center}
.modal-content{background:#fff;border-radius:8px;width:90%;max-width:500px;max-height:90vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #eee}
.modal-header h3{margin:0;font-size:18px}
.modal-body{padding:20px}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;padding:16px 20px;border-top:1px solid #eee}
.close{cursor:pointer;font-size:24px;color:#999}.close:hover{color:#333}
.form-group{margin-bottom:16px}.form-group label{display:block;margin-bottom:6px;font-weight:500}
.form-control{width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:4px;font-size:14px;box-sizing:border-box}
.form-control:focus{outline:none;border-color:#1890ff}textarea.form-control{resize:vertical}
.btn-sm{padding:4px 8px;font-size:12px}
</style>
<script>
function showAddModal(){document.getElementById('cfgId').value='0';document.getElementById('cfgKey').value='';document.getElementById('cfgValue').value='';document.getElementById('cfgDesc').value='';document.getElementById('configModal').style.display='flex'}
function editConfig(id,key,value,desc){document.getElementById('cfgId').value=id;document.getElementById('cfgKey').value=key;document.getElementById('cfgValue').value=value;document.getElementById('cfgDesc').value=desc;document.getElementById('configModal').style.display='flex'}
function cm(id){document.getElementById(id).style.display='none'}
async function saveConfig(){var id=parseInt(document.getElementById('cfgId').value);var key=document.getElementById('cfgKey').value;var value=document.getElementById('cfgValue').value;var desc=document.getElementById('cfgDesc').value;fetch('/system-config/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id,key:key,value:value,description:desc}),credentials:'same-origin'}).then(function(r){return r.json()}).then(function(res){if(res.success){window.location.reload()}else{alert('保存失败')}})}
async function deleteConfig(id){if(!confirm('确定要删除吗？'))return;fetch('/system-config/api',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id}),credentials:'same-origin'}).then(function(r){return r.json()}).then(function(res){if(res.success){window.location.reload()}else{alert('删除失败')}})}
</script>
{{end}}
