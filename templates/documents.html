{{define "content"}}
<div class="page-header"><h1 class="page-title">文档管理</h1></div>
<div class="card"><table class="table">
<thead><tr><th>文档名称</th><th>项目</th><th>阶段</th><th>类型</th><th>文件名</th><th>大小</th><th>版本</th><th>上传人</th><th>上传时间</th><th>操作</th></tr></thead>
<tbody>{{range .Documents}}<tr><td><div class="text-truncate" title="{{.Name}}">{{.Name}}</div></td><td>{{.ProjectName}}</td><td>{{.StageName}}</td><td>{{.Type}}</td><td><div class="text-truncate" title="{{.FileName}}">{{.FileName}}</div></td><td data-bytes="{{.FileSize}}" class="file-size">-</td><td>{{.Version}}</td><td>{{.UploadedBy}}</td><td>{{.CreatedAt.Format "2006-01-02"}}</td><td><a href="/documents/download?id={{.ID}}&name={{.FileName}}" class="btn btn-sm btn-default">下载</a> <button class="btn btn-sm btn-danger" onclick="deleteDocument({{.ID}})">删除</button></td></tr>{{else}}<tr><td colspan="10" style="text-align:center;color:#999;">暂无文档</td></tr>{{end}}</tbody>
</table></div>
<style>
.text-truncate{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.text-truncate:hover{color:#1890ff}
</style>
<script>
document.querySelectorAll('.file-size').forEach(function(el){var b=parseInt(el.getAttribute('data-bytes'));el.textContent=(b/1024).toFixed(2)+' KB'});
async function deleteDocument(id){if(!confirm('确定要删除这个文档吗？'))return;fetch('/documents/api',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id}),credentials:'same-origin'}).then(function(r){return r.json()}).then(function(res){if(res.success){window.location.reload()}else{alert('删除失败：'+res.message)}})}
</script>
{{end}}
