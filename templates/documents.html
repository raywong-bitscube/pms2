{{define "content"}}
<div class="page-header flex-between">
    <div><h1 class="page-title">文档管理</h1></div>
    <button class="btn btn-primary" onclick="showUploadModal()">📤 上传文档</button>
</div>

<div class="card">
    <table class="table">
        <thead>
            <tr><th>文档名称</th><th>类型</th><th>文件名</th><th>大小</th><th>版本</th><th>上传人</th><th>上传时间</th><th>操作</th></tr>
        </thead>
        <tbody>
            {{range .Documents}}
            <tr>
                <td>{{.Name}}</td>
                <td>{{.Type}}</td>
                <td>{{.FileName}}</td>
                <td>{{.FileSize}} KB</td>
                <td>{{.Version}}</td>
                <td>{{.UploadedBy}}</td>
                <td>{{.CreatedAt.Format "2006-01-02"}}</td>
                <td>
                    <button class="btn btn-sm btn-default">下载</button>
                    <button class="btn btn-sm btn-danger" onclick="deleteDocument({{.ID}})">删除</button>
                </td>
            </tr>
            {{else}}
            <tr><td colspan="8" style="text-align:center;color:#999;">暂无文档</td></tr>
            {{end}}
        </tbody>
    </table>
</div>

<!-- 上传文档模态框 -->
<div id="uploadModal" class="modal" style="display:none;">
    <div class="modal-content">
        <div class="modal-header"><h3>上传文档</h3><span class="close" onclick="closeModal('uploadModal')">&times;</span></div>
        <div class="modal-body">
            <form id="uploadForm" enctype="multipart/form-data">
                <div class="form-group"><label>文档名称</label><input type="text" id="docName" name="name" class="form-control" required></div>
                <div class="form-group"><label>文档类型</label>
                    <select id="docType" name="type" class="form-control">
                        <option value="requirement">需求文档</option>
                        <option value="design">设计文档</option>
                        <option value="code">代码文档</option>
                        <option value="test">测试文档</option>
                        <option value="manual">用户手册</option>
                        <option value="other">其他</option>
                    </select>
                </div>
                <div class="form-group"><label>选择文件</label><input type="file" id="docFile" name="file" class="form-control" required></div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn btn-default" onclick="closeModal('uploadModal')">取消</button>
            <button class="btn btn-primary" onclick="uploadDocument()">上传</button>
        </div>
    </div>
</div>
{{end}}
