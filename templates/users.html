{{define "content"}}
<div class="page-header flex-between">
    <div><h1 class="page-title">用户管理</h1></div>
    <button class="btn btn-primary" onclick="showUserModal()">+ 新建用户</button>
</div>

<div class="card">
    <table class="table">
        <thead><tr><th>用户名</th><th>姓名</th><th>邮箱</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead>
        <tbody>
            {{range .Users}}
            <tr>
                <td>{{.Username}}</td>
                <td>{{.RealName}}</td>
                <td>{{.Email}}</td>
                <td>{{if eq .Status 1}}<span class="tag tag-success">正常</span>{{else}}<span class="tag">禁用</span>{{end}}</td>
                <td>{{.CreatedAt.Format "2006-01-02"}}</td>
                <td><button class="btn btn-sm btn-default" onclick="alert('编辑用户功能待实现')">编辑</button></td>
            </tr>
            {{end}}
        </tbody>
    </table>
</div>

<!-- 创建用户模态框 -->
<div id="userModal" class="modal" style="display:none;">
    <div class="modal-content">
        <div class="modal-header"><h3>新建用户</h3><span class="close" onclick="closeModal('userModal')">&times;</span></div>
        <div class="modal-body">
            <div class="form-group"><label>用户名</label><input type="text" id="newUsername" class="form-control"></div>
            <div class="form-group"><label>密码</label><input type="password" id="newPassword" class="form-control"></div>
            <div class="form-group"><label>姓名</label><input type="text" id="newRealName" class="form-control"></div>
            <div class="form-group"><label>邮箱</label><input type="email" id="newEmail" class="form-control"></div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-default" onclick="closeModal('userModal')">取消</button>
            <button class="btn btn-primary" onclick="createUser()">创建</button>
        </div>
    </div>
</div>
{{end}}
