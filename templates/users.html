{{define "content"}}
<div class="page-header flex-between">
    <div><h1 class="page-title">用户管理</h1></div>
    <button class="btn btn-primary" onclick="showUserModal()">+ 新建用户</button>
</div>

<div class="card">
    <table class="table">
        <thead><tr><th>用户名</th><th>姓名</th><th>邮箱</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead>
        <tbody>
            {{range .Users}}
            <tr>
                <td>{{.Username}}</td>
                <td>{{.RealName}}</td>
                <td>{{.Email}}</td>
                <td>{{if eq .Status 1}}<span class="tag tag-success">正常</span>{{else}}<span class="tag">禁用</span>{{end}}</td>
                <td>{{.CreatedAt}}</td>
                <td><button class="btn btn-sm btn-default" onclick="alert('编辑用户功能待实现')">编辑</button></td>
            </tr>
            {{end}}
        </tbody>
    </table>
</div>

<!-- 创建用户模态框 -->
<div id="userModal" class="modal" style="display:none;">
    <div class="modal-content">
        <div class="modal-header"><h3>新建用户</h3><span class="close" onclick="closeModal('userModal')">&times;</span></div>
        <div class="modal-body">
            <div class="form-group"><label>用户名</label><input type="text" id="newUsername" class="form-control"></div>
            <div class="form-group"><label>密码</label><input type="password" id="newPassword" class="form-control"></div>
            <div class="form-group"><label>姓名</label><input type="text" id="newRealName" class="form-control"></div>
            <div class="form-group"><label>邮箱</label><input type="email" id="newEmail" class="form-control"></div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-default" onclick="closeModal('userModal')">取消</button>
            <button class="btn btn-primary" onclick="createUser()">创建</button>
        </div>
    </div>
</div>

<style>
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;display:flex;align-items:center;justify-content:center}
.modal-content{background:#fff;border-radius:8px;width:90%;max-width:500px;max-height:90vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #eee}
.modal-header h3{margin:0;font-size:18px}
.modal-body{padding:20px}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;padding:16px 20px;border-top:1px solid #eee}
.close{cursor:pointer;font-size:24px;color:#999}
.close:hover{color:#333}
.form-group{margin-bottom:16px}
.form-group label{display:block;margin-bottom:6px;font-weight:500}
.form-control{width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:4px;font-size:14px;box-sizing:border-box}
.form-control:focus{outline:none;border-color:#1890ff}
</style>
{{end}}
