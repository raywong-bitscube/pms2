<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{.Title}} - 项目管理系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="layout">
        <!-- 移动端遮罩层 -->
        <div class="menu-overlay" onclick="toggleMenu()"></div>
        
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo">📋 项目管理系统</div>
            <nav class="sidebar-menu">
                {{range .Menus}}
                <a href="{{.Url}}" class="menu-item{{if eq $.CurrentUrl .Url}} active{{end}}">
                    <span>{{.Icon}}</span><span>{{.Name}}</span>
                </a>
                {{end}}
            </nav>
        </aside>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Header -->
            <header class="header">
                <div class="header-left">
                    <button class="menu-toggle" onclick="toggleMenu()">
                        <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="20" height="20" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M4 6l16 0" /><path d="M4 12l16 0" /><path d="M4 18l16 0" /></svg>
                    </button>
                    <span class="breadcrumb">{{.Title}}</span>
                </div>
                <div class="header-right">
                    <a href="#" class="header-icon" title="通知">
                        <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="20" height="20" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M10 5a2 2 0 0 1 4 0a7 7 0 0 1 4 6v3a4 4 0 0 0 2 3h-16a4 4 0 0 0 2 -3v-3a7 7 0 0 1 4 -6" /><path d="M9 17v1a3 3 0 0 0 6 0v-1" /></svg>
                    </a>
                    <div class="user-info">
                        <div class="user-avatar">{{.CurrentUser.ID}}</div>
                        <span>{{.CurrentUser.RealName}}</span>
                    </div>
                    <a href="/logout" class="header-icon" title="退出登录">
                        <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="20" height="20" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M14 8v-2a2 2 0 0 0 -2 -2h-7a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2 -2v-2" /><path d="M7 12h14l-3 -3m0 6l3 -3" /></svg>
                    </a>
                </div>
            </header>

            <!-- Content -->
            <main class="content">
                {{template "content" .}}
            </main>
        </div>
    </div>
    <script src="/static/js/app.js?v=20260328"></script>
</body>
</html>
